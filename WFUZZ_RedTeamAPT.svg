      <circle cx="21" cy="52" r="2.6" fill="#8b5cf6"/><text x="34" y="56" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Hide responses with the specified code/lines/words/chars (Use</text><text x="34" y="73" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">BBB for taking values from baseline)</text><circle cx="21" cy="90" r="2.6" fill="#8b5cf6"/><text x="34" y="94" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Recursive path discovery being depth the maximum recursion</text><text x="34" y="111" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">level (0 default)</text><circle cx="21" cy="128" r="2.6" fill="#8b5cf6"/><text x="34" y="132" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">--hc/hl/hw/hh N[,N]+</text>
