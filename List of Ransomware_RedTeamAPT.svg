    </text>
    <text x="0" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="3px">ADVANCED OFFENSIVE CYBERSECURITY &amp; RED TEAM ROADMAP</text>
  </g>

  <g transform="translate(90, 170)">
    <g transform="translate(0, 0)">
    <g class="cat-card">
      <rect x="0" y="0" width="480" height="74" rx="10"
            fill="none" stroke="#00f0ff" stroke-width="1.6" stroke-dasharray="4,3"/>
      <rect x="14" y="-16" width="140" height="32" rx="7" fill="#00f0ff"/>
      <text x="84.0" y="5" text-anchor="middle"
            font-family="'Fira Code', monospace" font-size="12.5" font-weight="800" fill="#04060d">WannaCry</text>
      
    </g>
    </g><g transform="translate(498, 0)">
    <g class="cat-card">
      <rect x="0" y="0" width="480" height="238" rx="10"
            fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="4,3"/>
      <rect x="14" y="-16" width="140" height="32" rx="7" fill="#f59e0b"/>
      <text x="84.0" y="5" text-anchor="middle"
            font-family="'Fira Code', monospace" font-size="12.5" font-weight="800" fill="#04060d">Ryuk</text>
      <circle cx="21" cy="52" r="2.6" fill="#f59e0b"/><text x="34" y="56" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">One of the most infamous ransomware attacks in recent years</text><circle cx="21" cy="73" r="2.6" fill="#f59e0b"/><text x="34" y="77" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Believed to have originated in Russia</text><circle cx="21" cy="94" r="2.6" fill="#f59e0b"/><text x="34" y="98" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Targets vulnerabilities in Microsoft Windows operating</text><text x="34" y="115" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">systems</text><circle cx="21" cy="132" r="2.6" fill="#f59e0b"/><text x="34" y="136" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Targets businesses and organizations</text><circle cx="21" cy="153" r="2.6" fill="#f59e0b"/><text x="34" y="157" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Spread globally in May 2017</text><circle cx="21" cy="174" r="2.6" fill="#f59e0b"/><text x="34" y="178" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Uses encryption to lock victims&apos; files in exchange for ransom</text><circle cx="21" cy="195" r="2.6" fill="#f59e0b"/><text x="34" y="199" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">SamSam</text>
    </g>
    </g><g transform="translate(996, 0)">
    <g class="cat-card">
      <rect x="0" y="0" width="480" height="314" rx="10"
            fill="none" stroke="#10b981" stroke-width="1.6" stroke-dasharray="4,3"/>
      <rect x="14" y="-16" width="155.0" height="32" rx="7" fill="#10b981"/>
      <text x="91.5" y="5" text-anchor="middle"
            font-family="'Fira Code', monospace" font-size="12.5" font-weight="800" fill="#04060d">Petya/NotPetya</text>
      <circle cx="21" cy="52" r="2.6" fill="#10b981"/><text x="34" y="56" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Targeted healthcare organizations, causing disruptions and</text><text x="34" y="73" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">millions</text><circle cx="21" cy="90" r="2.6" fill="#10b981"/><text x="34" y="94" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Named after the fictional Russian submarine from &quot;The Hunt</text><text x="34" y="111" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">for Red October&quot;</text><circle cx="21" cy="128" r="2.6" fill="#10b981"/><text x="34" y="132" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">of dollars in damages.</text><circle cx="21" cy="149" r="2.6" fill="#10b981"/><text x="34" y="153" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Uses a worm to spread through networks</text><circle cx="21" cy="170" r="2.6" fill="#10b981"/><text x="34" y="174" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Utilized bruteforce attacks to gain access to systems.</text><circle cx="21" cy="191" r="2.6" fill="#10b981"/><text x="34" y="195" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Initially believed to be ransomware, later found to be a</text><text x="34" y="212" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">cyberattack</text><circle cx="21" cy="229" r="2.6" fill="#10b981"/><text x="34" y="233" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Demanded payments ranging from $6,000 to $50,000 in Bitcoin.</text><circle cx="21" cy="250" r="2.6" fill="#10b981"/><text x="34" y="254" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">disguised as ransomware</text><circle cx="21" cy="271" r="2.6" fill="#10b981"/><text x="34" y="275" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Cryptolocker</text>
    </g>
    </g><g transform="translate(0, 92)">
    <g class="cat-card">
      <rect x="0" y="0" width="480" height="242" rx="10"
            fill="none" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="4,3"/>
      <rect x="14" y="-16" width="140" height="32" rx="7" fill="#ef4444"/>
      <text x="84.0" y="5" text-anchor="middle"
            font-family="'Fira Code', monospace" font-size="12.5" font-weight="800" fill="#04060d">Locky</text>
      <circle cx="21" cy="52" r="2.6" fill="#ef4444"/><text x="34" y="56" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">First appeared in 2013</text><circle cx="21" cy="73" r="2.6" fill="#ef4444"/><text x="34" y="77" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Discovered in February 2016</text><circle cx="21" cy="94" r="2.6" fill="#ef4444"/><text x="34" y="98" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Targets Windows devices</text><circle cx="21" cy="115" r="2.6" fill="#ef4444"/><text x="34" y="119" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Spread through malicious email attachments</text><circle cx="21" cy="136" r="2.6" fill="#ef4444"/><text x="34" y="140" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Uses encryption to lock victims&apos; files and demands payment in</text><circle cx="21" cy="157" r="2.6" fill="#ef4444"/><text x="34" y="161" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Demands payment in Bitcoin</text><circle cx="21" cy="178" r="2.6" fill="#ef4444"/><text x="34" y="182" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">exchange for a decryption key</text><circle cx="21" cy="199" r="2.6" fill="#ef4444"/><text x="34" y="203" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Maze</text>
    </g>
    </g><g transform="translate(498, 256)">
    <g class="cat-card">
      <rect x="0" y="0" width="480" height="238" rx="10"
            fill="none" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="4,3"/>
      <rect x="14" y="-16" width="140" height="32" rx="7" fill="#8b5cf6"/>
      <text x="84.0" y="5" text-anchor="middle"
            font-family="'Fira Code', monospace" font-size="12.5" font-weight="800" fill="#04060d">GandCrab</text>
      <circle cx="21" cy="52" r="2.6" fill="#8b5cf6"/><text x="34" y="56" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">First discovered in May 2019</text><circle cx="21" cy="73" r="2.6" fill="#8b5cf6"/><text x="34" y="77" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Active from January 2018 to May 2019</text><circle cx="21" cy="94" r="2.6" fill="#8b5cf6"/><text x="34" y="98" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Targets businesses and organizations</text><circle cx="21" cy="115" r="2.6" fill="#8b5cf6"/><text x="34" y="119" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Discontinued by its creators after allegedly earning over $2</text><text x="34" y="136" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">billion in ransom payments</text><circle cx="21" cy="153" r="2.6" fill="#8b5cf6"/><text x="34" y="157" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Threatens to leak sensitive data if the ransom is not paid</text><circle cx="21" cy="174" r="2.6" fill="#8b5cf6"/><text x="34" y="178" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Spread through exploit kits and phishing emails</text><circle cx="21" cy="195" r="2.6" fill="#8b5cf6"/><text x="34" y="199" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Sodinokibi/REvil</text>
    </g>
    </g><g transform="translate(996, 332)">
    <g class="cat-card">
      <rect x="0" y="0" width="480" height="238" rx="10"
            fill="none" stroke="#ec4899" stroke-width="1.6" stroke-dasharray="4,3"/>
      <rect x="14" y="-16" width="140" height="32" rx="7" fill="#ec4899"/>
      <text x="84.0" y="5" text-anchor="middle"
            font-family="'Fira Code', monospace" font-size="12.5" font-weight="800" fill="#04060d">Bad Rabbit</text>
      <circle cx="21" cy="52" r="2.6" fill="#ec4899"/><text x="34" y="56" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Discovered in April 2019</text><circle cx="21" cy="73" r="2.6" fill="#ec4899"/><text x="34" y="77" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Hit Eastern Europe in 2017, spread through fake Adobe Flash</text><circle cx="21" cy="94" r="2.6" fill="#ec4899"/><text x="34" y="98" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">installers on compromised websites.</text><circle cx="21" cy="115" r="2.6" fill="#ec4899"/><text x="34" y="119" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Believed to be linked to the Russian hacking group &quot;GOLD</text><text x="34" y="136" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">SOUTHFIELD&quot;</text><circle cx="21" cy="153" r="2.6" fill="#ec4899"/><text x="34" y="157" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Encrypted files and demanded payment in Bitcoin.</text><circle cx="21" cy="174" r="2.6" fill="#ec4899"/><text x="34" y="178" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Targets large corporations and demands large ransom payments</text><circle cx="21" cy="195" r="2.6" fill="#ec4899"/><text x="34" y="199" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Used similar code to Petya ransomware.</text>
    </g>
    </g>
  </g>

