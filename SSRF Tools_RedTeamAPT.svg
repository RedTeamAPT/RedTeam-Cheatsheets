" fill="#10b981"/><text x="34" y="279" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">A &quot;malicious&quot; DNS server for executing DNS Rebinding attacks</text><text x="34" y="296" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">on the</text><circle cx="21" cy="313" r="2.6" fill="#10b981"/><text x="34" y="317" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">SSRFire</text><circle cx="21" cy="334" r="2.6" fill="#10b981"/><text x="34" y="338" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">whonow</text><circle cx="21" cy="355" r="2.6" fill="#10b981"/><text x="34" y="359" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">server and chill! ;) Also has options to find XSS and open</text><text x="34" y="376" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">redirects</text><circle cx="21" cy="393" r="2.6" fill="#10b981"/><text x="34" y="397" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">fly (public instance running on rebind.network:53)</text><circle cx="21" cy="414" r="2.6" fill="#10b981"/><text x="34" y="418" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">B-XSSRF</text><circle cx="21" cy="435" r="2.6" fill="#10b981"/><text x="34" y="439" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Toolkit to detect and keep track on Blind XSS, XXE &amp; SSRF</text><circle cx="21" cy="456" r="2.6" fill="#10b981"/><text x="34" y="460" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">singularity</text><circle cx="21" cy="477" r="2.6" fill="#10b981"/><text x="34" y="481" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">A DNS rebinding attack framework.</text><circle cx="21" cy="498" r="2.6" fill="#10b981"/><text x="34" y="502" font-family="sans-serif" font-size="12.5" font-weight="500" fill="#cb